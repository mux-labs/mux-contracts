name: Deploy Contracts

# Manually triggered with network and contract selection.
# Requires DEPLOYER_PRIVATE_KEY repository secret to be set (see
# docs/deployer-key-requirements.md). This is a long-lived funded key, not
# OIDC/keyless — it MUST be rotated (drained and replaced) after every
# mainnet deployment cycle per the security checklist in that doc.
#
# Mainnet deploys are deny-by-default: the immutable `MAINNET_DEPLOY_ENABLED`
# repository variable must be explicitly set to "true" before any live mainnet
# transaction is submitted. See docs/mainnet-immutable-flag-guidance.md.
#
# Usage (GitHub UI):
#   Actions → Deploy Contracts → Run workflow → fill inputs
#
# Usage (CLI):
#   gh workflow run deploy.yml -f network=testnet -f dry_run=true

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        default: "testnet"
        type: choice
        options:
          - testnet
          - mainnet
          - localnet
      contract:
        description: "Contract to deploy (leave empty to deploy all)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run — log actions without submitting transactions"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_build:
        description: "Skip cargo build (use pre-built WASMs from cache)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  # Only one deployment per network at a time
  group: deploy-${{ inputs.network }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Safety gate: immutable mainnet flag (deny-by-default) ────────────────────
  # Live mainnet deploys require the immutable MAINNET_DEPLOY_ENABLED repository
  # variable to be explicitly "true". Anything else (unset, empty, "false", or
  # any other value) aborts with a stable, actionable error. The flag is read
  # from repository configuration, not from workflow inputs, so it cannot be
  # silently overridden at runtime by a caller.
  mainnet-guard:
    name: Mainnet safety check
    runs-on: ubuntu-latest
    if: inputs.network == 'mainnet' && inputs.dry_run == 'false'
    steps:
      - name: Enforce immutable mainnet flag
        env:
          MAINNET_DEPLOY_ENABLED: ${{ vars.MAINNET_DEPLOY_ENABLED }}
        run: |
          if [[ "${MAINNET_DEPLOY_ENABLED}" != "true" ]]; then
            echo "::error::MAINNET_DEPLOY_DISABLED: live mainnet deploys are deny-by-default."
            echo "::error::Set the repository variable MAINNET_DEPLOY_ENABLED=true to enable them."
            echo "::error::See docs/mainnet-immutable-flag-guidance.md for the enable/rollback procedure."
            exit 1
          fi
          echo "::warning::You are about to deploy to MAINNET with live transactions."
          echo "::warning::Ensure you have completed the mainnet deploy checklist:"
          echo "::warning::  https://github.com/mux-labs/mux-contracts/blob/main/docs/mainnet-deploy-checklist.md"

  # ── Build contracts ──────────────────────────────────────────────────────────
  build:
    name: Build WASM artifacts
    runs-on: ubuntu-latest
    if: inputs.skip_build == 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deploy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deploy-

      - name: Build release WASMs
        run: |
          cargo build \
            --target wasm32-unknown-unknown \
            --release \
            --workspace

      - name: Upload WASMs
        uses: actions/upload-artifact@v4
        with:
          name: deploy-wasms-${{ github.run_id }}
          path: target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 1

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ inputs.network }}${{ inputs.dry_run == 'true' && ' (dry run)' || '' }}
    runs-on: ubuntu-latest
    needs: [build, mainnet-guard]
    # Run even if build was skipped (when skip_build=true). The mainnet-guard
    # job is skipped for non-mainnet/dry-run paths, so allow 'skipped' there;
    # a failed guard (deny-by-default) blocks the deploy.
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.mainnet-guard.result == 'success' || needs.mainnet-guard.result == 'skipped')
    environment:
      name: ${{ inputs.network }}

    steps:
      - uses: actions/checkout@v4

      - name: Download WASMs (if built in this run)
        if: inputs.skip_build == 'false'
        uses: actions/download-artifact@v4
        with:
          name: deploy-wasms-${{ github.run_id }}
          path: target/wasm32-unknown-unknown/release/

      - name: Install Stellar CLI
        run: |
          curl -fsSL \
            https://github.com/stellar/stellar-cli/releases/download/v21.4.0/stellar-cli-21.4.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Deploy contracts
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          DRY_FLAG=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            DRY_FLAG="--dry-run"
          fi

          CONTRACT_FLAG=""
          if [[ -n "${{ inputs.contract }}" ]]; then
            CONTRACT_FLAG="--contract ${{ inputs.contract }}"
          fi

          SKIP_BUILD_FLAG=""
          if [[ "${{ inputs.skip_build }}" == "true" ]]; then
            SKIP_BUILD_FLAG="--skip-build"
          fi

          bash scripts/deploy.sh \
            --network "${{ inputs.network }}" \
            ${DRY_FLAG} \
            ${SKIP_BUILD_FLAG} \
            ${CONTRACT_FLAG}

      - name: Print deployment summary
        if: inputs.dry_run == 'false'
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Network | ${{ inputs.network }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract(s) | ${{ inputs.contract || 'all' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Update \`config/addresses.json\` with deployed contract IDs and open a PR." >> "$GITHUB_STEP_SUMMARY"

      - name: Print dry-run summary
        if: inputs.dry_run == 'true'
        run: |
          echo "## Dry Run Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No transactions were submitted. Review the logs above to verify the planned actions." >> "$GITHUB_STEP_SUMMARY"

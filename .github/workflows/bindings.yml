name: Publish TypeScript Bindings

on:
  push:
    branches: [main]
    paths:
      - 'bindings/**'
      - 'contracts/**'
      - '.github/workflows/bindings.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bindings/**'
      - 'contracts/**'
      - '.github/workflows/bindings.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-bindings:
    name: Generate bindings from WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.81.0
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build WASM (release)
        run: bash scripts/build-wasm.sh --release
      - name: Generate TypeScript bindings
        run: bash scripts/generate-bindings.sh
      - name: Check for binding drift
        run: |
          git diff --exit-code bindings/src/generated/ || {
            echo "Generated bindings differ from committed state. Run scripts/generate-bindings.sh locally and commit the changes."
            exit 1
          }

  lint-and-test:
    name: Lint and test bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bindings/package-lock.json
      - name: Install dependencies
        working-directory: bindings
        run: npm ci
      - name: Lint
        working-directory: bindings
        run: npm run lint
      - name: TypeScript compile check
        working-directory: bindings
        run: npm run typecheck
      - name: Run tests
        working-directory: bindings
        run: npm test
      - name: Build distribution
        working-directory: bindings
        run: npm run build

  test-vectors:
    name: Committed test vectors (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bindings/package-lock.json
      - name: Install dependencies
        working-directory: bindings
        run: npm ci
      - name: Verify committed test vectors against generated bindings/ABI
        working-directory: bindings
        run: npx vitest run __tests__/test-vectors.test.ts --reporter=verbose

  publish:
    name: Publish to npm
    needs: [generate-bindings, lint-and-test, test-vectors]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        working-directory: bindings
        run: npm ci
      - name: Publish to npm with provenance
        working-directory: bindings
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

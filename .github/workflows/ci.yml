name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail-closed wasm size budget (bytes). Any compiled contract wasm larger
  # than this limit fails the build. Adjust deliberately and document why.
  WASM_SIZE_BUDGET_BYTES: "262144"

jobs:
  build-and-test:
    name: Build, test, and enforce wasm size budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce mainnet address review rule
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          bash scripts/test-check-mainnet-address-review.sh
          bash scripts/check-mainnet-address-review.sh

      - name: Verify network configuration and mainnet safety
        run: |
          bash scripts/test-network-config.sh
          bash scripts/network-config.sh mainnet

      - name: Verify mainnet deploy checklist script
        run: |
          bash scripts/test-check-mainnet-deploy-checklist.sh

      - name: Operationalize deployer key security checks
        run: |
          bash scripts/check-gitignore-secret-patterns.sh
          bash scripts/test-check-deploy-secret-name.sh
          bash scripts/check-deploy-secret-name.sh
          bash scripts/test-check-deployer-key-rotation-log.sh
          bash scripts/check-deployer-key-rotation-log.sh
          bash scripts/scan-git-secrets.sh --depth 100

      - name: Validate deploy env examples are secret-free
        run: bash scripts/validate-deploy-env.sh

      - name: Validate localnet env example is complete and secret-free
        run: bash scripts/validate-localnet-env.sh

  rust:
    name: Rust (fmt, clippy, test, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.81.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Pin to the MSRV declared in rust-toolchain.toml so CI and local
          # dev always use the same channel.  Any toolchain drift is caught
          # immediately on PRs rather than silently on contributor machines.
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Fail closed before spending time on a build: the workspace release
      # profile must match docs/release-profile-verification.md (#780).
      - name: Verify release profile invariants
        run: |
          bash scripts/test-check-release-profile.sh
          bash scripts/check-release-profile.sh

      # Release compilation must be warning-free; any rustc warning fails CI.
      - name: Build contracts (wasm)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Check formatting
        # Enforces the rustfmt rules in rustfmt.toml.  Running `cargo fmt
        # --all` locally produces identical output.  See issue #838.
        run: cargo fmt --all -- --check

      - name: Verify release wasm artifacts
        run: bash scripts/check-release-profile.sh --wasm-dir target/wasm32-unknown-unknown/release

      - name: Enforce wasm size budget
        run: |
          set -euo pipefail
          budget="${WASM_SIZE_BUDGET_BYTES}"
          echo "Wasm size budget: ${budget} bytes"
          found=0
          failed=0
          while IFS= read -r wasm; do
            found=1
            size=$(stat -c%s "$wasm")
            printf '%-60s %10s bytes\n' "$wasm" "$size"
            if [ "$size" -gt "$budget" ]; then
              echo "::error file=${wasm}::wasm size ${size} bytes exceeds budget ${budget} bytes"
              failed=1
            fi
          done < <(find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' -type f)
          if [ "$found" -eq 0 ]; then
            echo "::error::no wasm artifacts found; expected compiled contracts"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "One or more wasm artifacts exceed the size budget."
            exit 1
          fi
          echo "All wasm artifacts are within budget."

      # Only artifacts that passed every release-profile and size gate above
      # are published; a failed gate leaves no downloadable wasm behind.
      - name: Upload wasm artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
          retention-days: 14

      - name: Run tests
        working-directory: bindings
        run: npm test
      - name: Build distribution
        working-directory: bindings
        run: npm run build

  rollback-discipline:
    name: Rollback Discipline Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check rollback-log.md exists
        run: |
          if [ ! -f "ops/rollback-log.md" ]; then
            echo "Error: ops/rollback-log.md not found"
            exit 1
          fi
          echo "✓ ops/rollback-log.md exists"
      - name: Check SECURITY.md exists
        run: |
          if [ ! -f "SECURITY.md" ]; then
            echo "Error: SECURITY.md not found"
            exit 1
          fi
          echo "✓ SECURITY.md exists"
      - name: Check deploy.sh has rollback support
        run: |
          if ! grep -q "ROLLBACK_MODE" scripts/deploy.sh; then
            echo "Error: deploy.sh missing rollback mode support"
            exit 1
          fi
          echo "✓ deploy.sh has rollback support"
      - name: Check verify-rollback.sh exists and is executable
        run: |
          if [ ! -f "scripts/verify-rollback.sh" ]; then
            echo "Error: scripts/verify-rollback.sh not found"
            exit 1
          fi
          chmod +x scripts/verify-rollback.sh
          echo "✓ verify-rollback.sh exists and is executable"
      - name: Check check-feature-flags.sh exists and is executable
        run: |
          if [ ! -f "scripts/check-feature-flags.sh" ]; then
            echo "Error: scripts/check-feature-flags.sh not found"
            exit 1
          fi
          chmod +x scripts/check-feature-flags.sh
          echo "✓ check-feature-flags.sh exists and is executable"
      - name: Test feature flag check
        run: |
          # Test disabled flag (should fail)
          if bash scripts/check-feature-flags.sh ENABLE_ROLLBACK 2>/dev/null; then
            echo "Error: Feature flag check should fail when flag is not set"
            exit 1
          fi
          echo "✓ Feature flag check correctly fails when flag is not set"
          
          # Test enabled flag (should pass)
          if ! ENABLE_ROLLBACK=true bash scripts/check-feature-flags.sh ENABLE_ROLLBACK; then
            echo "Error: Feature flag check should pass when flag is set to true"
            exit 1
          fi
          echo "✓ Feature flag check correctly passes when flag is set to true"
      - name: Test rollback verification (dry-run)
        run: |
          if ! bash scripts/verify-rollback.sh --network testnet --strategy address-repoint --dry-run; then
            echo "Error: Rollback verification dry-run failed"
            exit 1
          fi
          echo "✓ Rollback verification dry-run passes"
      - name: Check docs have rollback cross-links
        run: |
          if ! grep -q "ops/rollback-log.md" docs/rollback-deploy.md; then
            echo "Error: docs/rollback-deploy.md missing link to ops/rollback-log.md"
            exit 1
          fi
          if ! grep -q "SECURITY.md" docs/rollback-deploy.md; then
            echo "Error: docs/rollback-deploy.md missing link to SECURITY.md"
            exit 1
          fi
          echo "✓ Documentation has rollback cross-links"

  upgrade-discipline:
    name: Upgrade Auth Discipline Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check upgrade-auth-requirements.md exists
        run: |
          if [ ! -f "docs/upgrade-auth-requirements.md" ]; then
            echo "Error: docs/upgrade-auth-requirements.md not found"
            exit 1
          fi
          echo "✓ docs/upgrade-auth-requirements.md exists"
      - name: Check verify-upgrade.sh exists and is executable
        run: |
          if [ ! -f "scripts/verify-upgrade.sh" ]; then
            echo "Error: scripts/verify-upgrade.sh not found"
            exit 1
          fi
          chmod +x scripts/verify-upgrade.sh
          echo "✓ verify-upgrade.sh exists and is executable"
      - name: Check upgrade.sh exists and is executable
        run: |
          if [ ! -f "scripts/upgrade.sh" ]; then
            echo "Error: scripts/upgrade.sh not found"
            exit 1
          fi
          chmod +x scripts/upgrade.sh
          echo "✓ upgrade.sh exists and is executable"
      - name: Check test-upgrade-verification.sh exists and is executable
        run: |
          if [ ! -f "scripts/test-upgrade-verification.sh" ]; then
            echo "Error: scripts/test-upgrade-verification.sh not found"
            exit 1
          fi
          chmod +x scripts/test-upgrade-verification.sh
          echo "✓ test-upgrade-verification.sh exists and is executable"
      - name: Test upgrade feature flag check
        run: |
          # Test disabled flag (should fail)
          if bash scripts/check-feature-flags.sh ENABLE_CONTRACT_UPGRADE 2>/dev/null; then
            echo "Error: Feature flag check should fail when flag is not set"
            exit 1
          fi
          echo "✓ Upgrade feature flag check correctly fails when flag is not set"
          
          # Test enabled flag (should pass)
          if ! ENABLE_CONTRACT_UPGRADE=true bash scripts/check-feature-flags.sh ENABLE_CONTRACT_UPGRADE; then
            echo "Error: Feature flag check should pass when flag is set to true"
            exit 1
          fi
          echo "✓ Upgrade feature flag check correctly passes when flag is set to true"
      - name: Test upgrade verification (dry-run)
        run: |
          local valid_hash="a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
          if ! bash scripts/verify-upgrade.sh --network testnet --contract mux-account --new-wasm-hash "$valid_hash" --dry-run; then
            echo "Error: Upgrade verification dry-run failed"
            exit 1
          fi
          echo "✓ Upgrade verification dry-run passes"
      - name: Test upgrade verification disabled on mainnet
        run: |
          local valid_hash="a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
          if ENABLE_CONTRACT_UPGRADE=false bash scripts/verify-upgrade.sh --network mainnet --contract mux-account --new-wasm-hash "$valid_hash" --dry-run 2>&1 | grep -q "Upgrade operations are disabled"; then
            echo "✓ Upgrade correctly disabled on mainnet by default"
          else
            echo "Error: Upgrade should be disabled on mainnet by default"
            exit 1
          fi
      - name: Run upgrade verification tests
        run: |
          if ! bash scripts/test-upgrade-verification.sh; then
            echo "Error: Upgrade verification tests failed"
            exit 1
          fi
          echo "✓ Upgrade verification tests pass"
      - name: Check docs have upgrade auth cross-links
        run: |
          if ! grep -q "upgrade-auth-requirements.md" docs/contract-upgrade-pattern.md; then
            echo "Error: docs/contract-upgrade-pattern.md missing link to upgrade-auth-requirements.md"
            exit 1
          fi
          if ! grep -q "upgrade-auth-requirements.md" docs/MAINNET_DEPLOY_CHECKLIST.md; then
            echo "Error: docs/MAINNET_DEPLOY_CHECKLIST.md missing link to upgrade-auth-requirements.md"
            exit 1
          fi
          if ! grep -q "upgrade-auth-requirements.md" README.md; then
            echo "Error: README.md missing link to upgrade-auth-requirements.md"
            exit 1
          fi
          echo "✓ Documentation has upgrade auth cross-links"
        run: cargo test --workspace
      - name: Enforce Clippy warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Validate contract IDs and dependency documentation
        run: |
          bash scripts/check-contract-ids-sync.sh \
            --types bindings/src/types.ts \
            --addresses config/addresses.json \
            --root-doc CONTRACT_IDS.md \
            --detail-doc docs/contract-ids.md
          bash scripts/check-dependency-graph.sh

      - name: Assert all expected contracts are generated in bindings
        # Fail-closed: every contract listed in generate-bindings.sh must have
        # a corresponding directory in bindings/src/generated/ so that silent
        # WASM skipping in the generate step is caught before publish.
        run: |
          set -euo pipefail
          EXPECTED_CONTRACTS=(
            "mux-account"
            "mux-account-factory"
            "mux-batcher"
            "mux-permissions"
            "mux-policy"
            "mux-registry"
          )
          GENERATED_DIR="bindings/src/generated"
          failed=0
          for contract in "${EXPECTED_CONTRACTS[@]}"; do
            if [ ! -d "${GENERATED_DIR}/${contract}" ]; then
              echo "::error::Expected generated contracts directory not found: ${GENERATED_DIR}/${contract}"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more expected generated-contracts directories are missing."
            echo "Run: bash scripts/generate-bindings.sh"
            exit 1
          fi
          echo "All expected generated contracts directories are present."

  # ── Security policy & security.txt staleness guard (#839) ───────────────────
  # Fails the build if security.txt has expired or will expire within 60 days,
  # or if SECURITY.md / .github/ISSUE_TEMPLATE/config.yml drift from the
  # requirements verified by scripts/check-security-policy.sh.
  security-policy:
    name: Security policy and security.txt expiry check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run security policy consistency checks
        run: bash scripts/check-security-policy.sh

      - name: Enforce security.txt Expires is set and not stale
        run: |
          set -euo pipefail
          SECURITY_TXT=".well-known/security.txt"
          if [[ ! -f "$SECURITY_TXT" ]]; then
            echo "::error::$SECURITY_TXT not found"
            exit 1
          fi
          expires_line=$(grep -E '^Expires:' "$SECURITY_TXT" || true)
          if [[ -z "$expires_line" ]]; then
            echo "::error::$SECURITY_TXT has no Expires field"
            exit 1
          fi
          expires_value=$(echo "$expires_line" | sed 's/^Expires:[[:space:]]*//')
          expires_epoch=$(date -d "$expires_value" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S.%fZ" "$expires_value" +%s 2>/dev/null || true)
          now_epoch=$(date +%s)
          warn_epoch=$(( now_epoch + 60 * 86400 ))
          if [[ -z "$expires_epoch" ]]; then
            echo "::error::Could not parse Expires date: $expires_value"
            exit 1
          fi
          if [[ "$expires_epoch" -lt "$now_epoch" ]]; then
            echo "::error::security.txt has EXPIRED (Expires: $expires_value). Rotate it immediately."
            exit 1
          fi
          if [[ "$expires_epoch" -lt "$warn_epoch" ]]; then
            echo "::warning::security.txt expires within 60 days ($expires_value). Rotate it soon."
          fi
          echo "security.txt Expires is valid: $expires_value"

[package]
name = "mux-contract-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Integration / fuzz scaffolding tests for mux-contracts"

# The library target (src/lib.rs) exposes shared helpers — currently
# `mock_env` — to the integration test binaries below. `soroban-sdk` must be
# a normal dependency because the lib target is not compiled with
# `--cfg test` (issue #919: the old `#[cfg(test)]` gate made the helpers
# unreachable from integration tests). The crate is publish = false, so
# test-only features in the lib are fine.
[lib]
name = "mux_contract_tests"
path = "src/lib.rs"

[dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
mux-account = { path = "../contracts/mux-account", features = ["testutils"] }
mux-batcher = { path = "../contracts/mux-batcher", features = ["testutils"] }
mux-permissions = { path = "../contracts/mux-permissions", features = ["testutils"] }
mux-policy = { path = "../contracts/mux-policy", features = ["testutils"] }
soroban-test-helpers = { path = "../contracts/soroban-test-helpers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "fuzz_placeholder"
path = "fuzz_placeholder.rs"

[[test]]
name = "cross_contract_integration"
path = "cross_contract_integration.rs"

[[test]]
name = "fixture_vectors"
path = "fixture_vectors.rs"

[[test]]
name = "upgrade_preflight"
path = "upgrade_preflight.rs"

[[test]]
name = "threat_model_coverage"
path = "threat_model_coverage.rs"

[[test]]
name = "bindings_coverage"
path = "bindings_coverage.rs"

[[test]]
name = "entrypoint_matrix_coverage"
path = "entrypoint_matrix_coverage.rs"

[[test]]
name = "aa_phase2_milestone"
path = "aa_phase2_milestone.rs"

[[test]]
name = "session_auth_doc_coverage"
path = "session_auth_doc_coverage.rs"

[[test]]
name = "expiry_naming"
path = "expiry_naming.rs"

[[test]]
name = "test_helpers_isolation"
path = "test_helpers_isolation.rs"
